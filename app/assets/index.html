<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;min-width:0}
html,body{margin:0;background:#F2F6F0;color:#1C2420;font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0;text-align:left}
button:focus-visible,summary:focus-visible{outline:3px solid #8FC7A2;outline-offset:2px}
.page{max-width:520px;margin:0 auto;padding:20px 16px calc(92px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:26px;line-height:1.2;font-weight:800}
.sub{margin:2px 0 6px;font-size:15px;color:#4A554F}
.org{color:#8A3D10}
.sec{font-size:14px;font-weight:700;color:#4A554F;margin:10px 2px 0}
details.menu{background:#fff;border-radius:18px;box-shadow:0 1px 2px rgba(28,36,32,.05)}
details.menu summary{list-style:none;display:flex;flex-direction:column;gap:6px;padding:16px;cursor:pointer}
details.menu summary::-webkit-details-marker{display:none}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.nm{font-size:19px;font-weight:800}
.price{font-size:14px;font-weight:700;color:#8A3D10;white-space:nowrap}
.dishes{font-size:15px;color:#4A554F;line-height:1.5}
.more{font-size:14px;font-weight:700;color:#2E6B45}
details[open] .more .o{display:none}details:not([open]) .more .c{display:none}
.body{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.dish{border-top:1px solid #EEF2EC;padding-top:12px;display:flex;gap:12px;align-items:flex-start}
.pic{flex:0 0 64px;width:64px;height:64px}.pic svg{display:block}.dt{flex:1}
.go{display:inline-flex;align-items:center;min-height:40px;margin-top:4px;padding:0 14px;border-radius:999px;background:#E3EFE6;color:#2E6B45;font-size:14px;font-weight:700;text-decoration:none}
.go:active{background:#CFE3D5}
.dish .t{font-size:13px;color:#5B6660}
.pill{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;margin-right:6px}
.p-A{color:#2E6B45;background:#E3EFE6}.p-B{color:#8A3D10;background:#FCEBDD}.p-Canh{color:#1F5C8A;background:#E3EEF7}.p-Rau{color:#4D5B10;background:#EEF2DC}
.dish .n{font-size:17px;font-weight:600;margin-top:2px}
.dish .i{font-size:14px;color:#5B6660}
.meals{font-size:14px;color:#4A554F;background:#F5F8F4;border-radius:12px;padding:10px 12px;line-height:1.5}
.card{background:#fff;border-radius:18px;padding:6px 16px;box-shadow:0 1px 2px rgba(28,36,32,.05)}
.chead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:12px 0 2px}
.chead b{font-size:19px}
.when{font-size:14px;color:#5B6660;padding-bottom:6px}
.item{display:flex;gap:14px;align-items:center;width:100%;min-height:56px;padding:8px 0;border-top:1px solid #EEF2EC}
.bx{flex:0 0 28px;width:28px;height:28px;border-radius:8px;border:2.5px solid #2E6B45;display:flex;align-items:center;justify-content:center;color:#fff}
.bx svg{display:none}
.on .bx{background:#2E6B45}.on .bx svg{display:block}
.item .n{flex:1;font-size:17px}
.on .n{color:#8A958F;text-decoration:line-through}
.q{text-align:right;white-space:nowrap}.q b{display:block;font-size:16px}.q span{font-size:13px;color:#8A3D10}
.on .q{opacity:.5}
.total{display:flex;justify-content:space-between;align-items:center;background:#2E6B45;color:#fff;border-radius:18px;padding:14px 16px}
.total b{font-size:24px}
.reset{align-self:center;min-height:46px;padding:0 18px;border:1.5px solid #C9D5C5;border-radius:999px;background:#fff;font-size:15px;font-weight:600;color:#4A554F;margin-top:6px}
.foot{font-size:12px;color:#5B6660;text-align:center;line-height:1.5}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #E1E9DE;padding-bottom:env(safe-area-inset-bottom)}
.nav div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:64px;font-size:14px;font-weight:700;color:#6B766F;text-align:center}
.nav button svg{stroke:currentColor}
.nav button.act{color:#2E6B45}
</style>

\"37\" rx=\"5.5\" ry=\"4\" fill=\"#C8483A\"/><ellipse cx=\"42\" cy=\"36.4\" rx=\"3.6\" ry=\"2.4\" fill=\"#E58A7A\"/><path d=\"M24 32q5-5 10 0M36 44q5-5 10 0\" stroke=\"#E9DDF0\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/></svg>",nam:"<svg viewBox=\"0 0 64 64\" width=\"64\" height=\"64\" aria-hidden=\"true\"><rect width=\"64\" height=\"64\" rx=\"16\" fill=\"#FDF6D8\"/><ellipse cx=\"32\" cy=\"40\" rx=\"26\" ry=\"13\" fill=\"#fff\" stroke=\"#D6E0D2\" stroke-width=\"1.5\"/><ellipse cx=\"32\" cy=\"39\" rx=\"18\" ry=\"8\" fill=\"#F7F9F5\"/><path d=\"M16 41c2-7 10-8 14-6 6-3 15-1 17 5-6 6-25 7-31 1z\" fill=\"#F6C944\"/><path d=\"M22 41V27M26 41V25M30 41V26M34 41V24M38 41V27M42 41V29\" stroke=\"#FFFDF5\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><g fill=\"#F3E9CF\"><circle cx=\"22\" cy=\"26.5\" r=\"2\"/><circle cx=\"26\" cy=\"24.5\" r=\"2\"/><circle cx=\"30\" cy=\"25.5\" r=\"2\"/><circle cx=\"34\" cy=\"23.5\" r=\"2\"/><circle cx=\"38\" cy=\"26.5\" r=\"2\"/><circle cx=\"42\" cy=\"28.5\" r=\"2\"/></g></svg>",bido:"<svg viewBox=\"0 0 64 64\" width=\"64\" height=\"64\" aria-hidden=\"true\"><rect width=\"64\" height=\"64\" rx=\"16\" fill=\"#FDEBD9\"/><ellipse cx=\"32\" cy=\"40\" rx=\"26\" ry=\"13\" fill=\"#fff\" stroke=\"#D6E0D2\" stroke-width=\"1.5\"/><ellipse cx=\"32\" cy=\"39\" rx=\"18\" ry=\"8\" fill=\"#F7F9F5\"/><rect x=\"16\" y=\"33\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#F08A2C\"/><rect x=\"27\" y=\"36\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#E57A1E\"/><rect x=\"37\" y=\"32\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#F39A44\"/><rect x=\"24\" y=\"29\" width=\"8\" height=\"7\" rx=\"2\" fill=\"#F5A657\"/><path d=\"M16 33h9M27 36h9M37 32h9\" stroke=\"#5E8E3E\" stroke-width=\"1.6\"/><circle cx=\"20\" cy=\"44\" r=\"1.6\" fill=\"#F5F0E0\"/><circle cx=\"45\" cy=\"43\" r=\"1.6\" fill=\"#F5F0E0\"/></svg>"};

let S = { tab: 'menu', ck: {} };
try { const v = JSON.parse(localStorage.getItem(KEY) || 'null'); if (v) S = Object.assign(S, v); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const TICK = '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const ICON_MENU = '<svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>';
const ICON_SHOP = '<svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg>';
const allKeys = () => { const k = []; D.shop.forEach((b, x) => b.items.forEach((_, i) => k.push('s' + x + '-' + i))); D.spices.forEach((_, i) => k.push('g' + i)); return k; };

function menuView() {
  let h = '<h1>Thực đơn</h1><div class="sub">7 thực đơn, mỗi thực đơn nấu 1 buổi sáng, ăn đủ 3 bữa. Bấm vào để xem nguyên liệu và cách làm.</div>';
  [1, 2].forEach(g => {
    h += '<div class="sec">' + (g === 1 ? 'Dùng đồ đi chợ đợt 1' : 'Dùng đồ đi chợ đợt 2') + '</div>';
    D.menus.filter(m => m.group === g).forEach(m => {
      h += '<details class="menu"><summary><span class="row"><span class="nm">' + m.id + '. ' + esc(m.name) + '</span><span class="price">~' + m.total + 'k</span></span>';
      h += '<span class="dishes">' + m.items.map(i => esc(i.name)).join(' · ') + '</span><span class="more"><span class="o">Xem món & cách làm ▾</span><span class="c">Thu gọn ▴</span></span></summary><div class="body">';
      h += m.items.map(i => '<div class="dish"><div class="pic">' + (IMG[i.img] || '') + '</div><div class="dt"><div class="t"><span class="pill p-' + i.type + '">' + i.type + '</span>' + i.when + '</div><div class="n">' + esc(i.name) + '</div><div class="i">' + esc(i.ingr) + '</div><a class="go" href="' + esc(i.url) + '" target="_blank" rel="noopener">Xem cách làm ↗</a></div></div>').join('');
      h += '<div class="meals">Sáng: A + canh · Trưa: A + rau · Tối: B + canh + rau</div></div></details>';
    });
  });
  return h;
}

function row(k, name, qty, price) {
  const on = !!S.ck[k];
  return '<button class="item' + (on ? ' on' : '') + '" data-k="' + k + '" aria-pressed="' + on + '"><span class="bx">' + TICK + '</span><span class="n">' + esc(name) + '</span>' + (qty ? '<span class="q"><b>' + esc(qty) + '</b><span>~' + price + 'k</span></span>' : '') + '</button>';
}
function shopView() {
  const keys = allKeys(), done = keys.filter(k => S.ck[k]).length;
  let h = '<h1>Đi chợ</h1><div class="sub">Đã mua ' + done + '/' + keys.length + ' món</div>';
  D.shop.forEach((b, x) => {
    const t = b.items.reduce((a, r) => a + r.price, 0);
    h += '<div class="card"><div class="chead"><b>' + b.title + '</b><span class="price">~' + t + 'k</span></div><div class="when">' + esc(b.when) + '</div>';
    h += b.items.map((r, i) => row('s' + x + '-' + i, r.name, r.qty, r.price)).join('') + '</div>';
  });
  h += '<div class="card"><div class="chead"><b>Gia vị</b><span class="price">~20k</span></div><div class="when">Chỉ mua nếu ở nhà đã hết</div>' + D.spices.map((n, i) => row('g' + i, n)).join('') + '</div>';
  h += '<div class="total"><span>Tổng ước tính</span><b>~' + D.total + 'k</b></div>';
  h += '<button class="reset" data-reset="1">Bỏ tick tất cả</button>';
  return h;
}

let resetArmed = 0;
function render() {
  let h = '<main class="page">' + (S.tab === 'shop' ? shopView() : menuView()) + '<div class="foot">Ảnh minh họa tự vẽ; công thức từ Điện máy XANH / Bách hóa XANH.<br>Giá ước tính theo giá thường ở Bách hóa XANH, có thể lệch ±10–15%.</div></main>';
  h += '<nav class="nav" aria-label="Điều hướng"><div><button class="' + (S.tab !== 'shop' ? 'act' : '') + '" data-tab="menu">' + ICON_MENU + 'Thực đơn</button><button class="' + (S.tab === 'shop' ? 'act' : '') + '" data-tab="shop">' + ICON_SHOP + 'Đi chợ</button></div></nav>';
  document.getElementById('app').innerHTML = h;
}
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.tab) { S.tab = b.dataset.tab; window.scrollTo(0, 0); }
  else if (b.dataset.k) { const k = b.dataset.k; if (S.ck[k]) delete S.ck[k]; else S.ck[k] = true; }
  else if (b.dataset.reset) {
    const now = Date.now();
    if (now - resetArmed > 4000) { resetArmed = now; b.textContent = 'Bấm lần nữa để bỏ tick hết'; return; }
    resetArmed = 0; S.ck = {};
  } else return;
  save(); render();
});
render();
}
</script>
