name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'temporary-build-key' }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.jks
            echo "Using the signing key from repository secrets."
          else
            echo "::warning::KEYSTORE_BASE64 secret is not set; signing with a temporary key. Updates will need a reinstall until the secret is added."
            keytool -genkeypair -keystore release.jks -alias thucdon -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
              -dname "CN=Thuc Don 7 Ngay, C=VN"
          fi

      - name: Build
        env:
          KEYSTORE: release.jks
          KEY_ALIAS: thucdon
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'temporary-build-key' }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: thuc-don-7-ngay-apk
          path: build/thuc-don-7-ngay.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Thực đơn 7 ngày v1.0.${{ github.run_number }}
          body: |
            Tải file **thuc-don-7-ngay.apk** bên dưới về điện thoại Android rồi mở để cài.
            Link cố định cho bản mới nhất: https://github.com/${{ github.repository }}/releases/latest/download/thuc-don-7-ngay.apk
          files: build/thuc-don-7-ngay.apk
          make_latest: true
