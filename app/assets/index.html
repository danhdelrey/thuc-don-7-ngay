<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;min-width:0}
html,body{margin:0;background:#F2F6F0;color:#1C2420;font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0;text-align:left}
button:focus-visible,summary:focus-visible{outline:3px solid #8FC7A2;outline-offset:2px}
.page{max-width:520px;margin:0 auto;padding:20px 16px calc(92px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:26px;line-height:1.2;font-weight:800}
.sub{margin:2px 0 6px;font-size:15px;color:#4A554F}
.org{color:#8A3D10}
.tip{font-size:14px;color:#4A554F;background:#FFF7E8;border-radius:12px;padding:10px 12px;line-height:1.45}
.sec{font-size:14px;font-weight:700;color:#4A554F;margin:10px 2px 0}
details.menu{background:#fff;border-radius:18px;box-shadow:0 1px 2px rgba(28,36,32,.05)}
details.menu summary{list-style:none;display:flex;flex-direction:column;gap:6px;padding:16px;cursor:pointer}
details.menu summary::-webkit-details-marker{display:none}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.nm{font-size:19px;font-weight:800}
.price{font-size:14px;font-weight:700;color:#8A3D10;white-space:nowrap}
.dishes{font-size:15px;color:#4A554F;line-height:1.5}
.more{font-size:14px;font-weight:700;color:#2E6B45}
details[open] .more .o{display:none}details:not([open]) .more .c{display:none}
.body{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.dish{border-top:1px solid #EEF2EC;padding-top:12px;display:flex;gap:12px;align-items:flex-start}
.pic{flex:0 0 64px;width:64px;height:64px}.pic svg{display:block}.dt{flex:1}
.go{display:inline-flex;align-items:center;min-height:40px;margin-top:4px;padding:0 14px;border-radius:999px;background:#E3EFE6;color:#2E6B45;font-size:14px;font-weight:700;text-decoration:none}
.go:active{background:#CFE3D5}
.dish .t{font-size:13px;color:#5B6660}
.pill{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;margin-right:6px}
.p-A{color:#2E6B45;background:#E3EFE6}.p-B{color:#8A3D10;background:#FCEBDD}.p-Canh{color:#1F5C8A;background:#E3EEF7}.p-Rau{color:#4D5B10;background:#EEF2DC}
.dish .n{font-size:17px;font-weight:600;margin-top:2px}
.dish .i{font-size:14px;color:#5B6660}
.meals{font-size:14px;color:#4A554F;background:#F5F8F4;border-radius:12px;padding:10px 12px;line-height:1.5}
.card{background:#fff;border-radius:18px;padding:6px 16px;box-shadow:0 1px 2px rgba(28,36,32,.05)}
.chead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:12px 0 2px}
.chead b{font-size:19px}
.when{font-size:14px;color:#5B6660;padding-bottom:6px}
.item{display:flex;gap:14px;align-items:center;width:100%;min-height:56px;padding:8px 0;border-top:1px solid #EEF2EC}
.bx{flex:0 0 28px;width:28px;height:28px;border-radius:8px;border:2.5px solid #2E6B45;display:flex;align-items:center;justify-content:center;color:#fff}
.bx svg{display:none}
.on .bx{background:#2E6B45}.on .bx svg{display:block}
.item .n{flex:1;font-size:17px}
.on .n{color:#8A958F;text-decoration:line-through}
.q{text-align:right;white-space:nowrap}.q b{display:block;font-size:16px}.q span{font-size:13px;color:#8A3D10}
.on .q{opacity:.5}
.total{display:flex;justify-content:space-between;align-items:center;background:#2E6B45;color:#fff;border-radius:18px;padding:14px 16px}
.total b{font-size:24px}
.reset{align-self:center;min-height:46px;padding:0 18px;border:1.5px solid #C9D5C5;border-radius:999px;background:#fff;font-size:15px;font-weight:600;color:#4A554F;margin-top:6px}
.foot{font-size:12px;color:#5B6660;text-align:center;line-height:1.5}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #E1E9DE;padding-bottom:env(safe-area-inset-bottom)}

.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:64px;font-size:14px;font-weight:700;color:#6B766F;text-align:center}

.nav button.act{color:#2E6B45}
.chips{display:flex;gap:8px;flex-wrap:wrap}

.chip.act{background:#2E6B45;border-color:#2E6B45;color:#fff}

.st{font-size:14px;font-weight:600}.st.ok{color:#2E6B45}.st.no{color:#8A3D10}

.pic{border-radius:14px;overflow:hidden;background:#EEF2EC}

.cansum.ok{border:none;background:#E3EFE6;color:#2E6B45;font-weight:700}.cansum span{white-space:nowrap}

.credits div{padding:3px 0 6px}.credits a{color:#2E6B45}
.nav div{grid-template-columns:1fr 1fr 1fr!important}
.cnt{font-size:13px;color:#5B6660}
.use{font-size:14px;color:#4A554F;line-height:1.5}
.cook{width:100%;min-height:52px;border-radius:14px;background:#2E6B45;color:#fff;font-weight:700;font-size:16px;text-align:center;padding:8px 14px}

.kr{display:flex;align-items:center;gap:12px;min-height:60px;border-top:1px solid #EEF2EC;padding:6px 0}

.page.hasdock{padding-bottom:calc(164px + env(safe-area-inset-bottom))}
.dock{position:fixed;left:0;right:0;bottom:calc(65px + env(safe-area-inset-bottom));padding:10px 16px;background:linear-gradient(rgba(242,246,240,0),#F2F6F0 30%)}

    h += '<div class="use"><b>Sẽ trừ khỏi kho:</b> ' + Object.keys(m.need).map(k => D.ing[k].short + ' ' + fmt(k, m.need[k])).join(' · ') + '</div>';
    h += miss.length
      ? '<div class="lock"><button class="cook" disabled aria-disabled="true">🔒 Chưa thể đánh dấu đã nấu</button><p>Kho còn thiếu: ' + miss.map(x => D.ing[x.k].short + ' ' + fmt(x.k, x.short)).join(', ') + '. Mua thêm hoặc chỉnh lại số lượng trong kho nếu thực tế bạn đã có.</p><button class="lnk" data-tab="kho">Mở kho</button></div>'
      : '<button class="cook" data-cook="' + m.id + '">Đã nấu thực đơn này: trừ khỏi kho</button>';
    h += '</div></details>';
  });
  const cr = []; D.menus.forEach(m => m.items.forEach(i => { if (i.photo) cr.push(i); }));
  if (cr.length) h += '<details class="credits"><summary>Nguồn ảnh (Wikimedia Commons)</summary>' + cr.map(i => '<div><b>' + esc(i.name) + '</b>: <a href="' + esc(i.page) + '" target="_blank" rel="noopener">' + esc(i.author) + '</a>, ' + esc(i.license) + '</div>').join('') + '</details>';
  return h;
}

function khoView() {
  const keys = Object.keys(D.ing), inS = keys.filter(k => have(k) > 0), out = keys.filter(k => !(have(k) > 0)), can = canCook();
  let h = '<h1>Kho</h1><div class="sub">Thực phẩm đang có trong tủ lạnh. Bấm − / + để chỉnh nếu lệch.</div>';
  h += '<button class="cansum' + (can.length ? ' ok' : '') + '" data-tab="menu" data-only="1">' + (can.length ? '✓ Nấu được ' + can.length + ' thực đơn: ' + can.map(m => m.id + '. ' + esc(m.name)).join(', ') + ' <span>Xem ›</span>' : 'Chưa đủ đồ cho thực đơn nào') + '</button>';
  if (!inS.length) h += '<div class="empty"><div class="em">🧊</div><b>Kho đang trống</b><p>Đi chợ xong, tick những món đã mua rồi bấm “Cho vào kho”.</p><button class="cta" data-tab="shop">Mở danh sách đi chợ</button></div>';
  const line = k => { const u = D.ing[k], left = have(k) > 0; return '<div class="kr' + (left ? '' : ' out') + '"><span class="n">' + esc(u.name) + '<small>' + (left ? fmt(k, have(k)) : 'Hết') + '</small></span><span class="step"><button data-adj="' + k + '" data-d="-1" aria-label="Bớt ' + esc(u.name) + '"' + (left ? '' : ' disabled') + '>−</button><button data-adj="' + k + '" data-d="1" aria-label="Thêm ' + esc(u.name) + '">+</button></span></div>'; };
  if (inS.length) h += '<div class="card"><div class="chead"><b>Đang có</b><span class="price">' + inS.length + ' loại</span></div>' + inS.map(line).join('') + '</div>';
  h += '<div class="card"><div class="chead"><b>' + (inS.length ? 'Đã hết / chưa có' : 'Thêm tay') + '</b></div><div class="when">Bấm + để thêm nếu mua lẻ ngoài danh sách.</div>' + out.map(line).join('') + '</div>';
  if (inS.length) h += '<button class="reset" data-clear="1">' + (armed === 'clear' ? 'Bấm lần nữa để xoá hết kho' : 'Xoá hết kho') + '</button>';
  return h;
}

function row(k, name, qty, price, key) {
  const on = !!S.ck[k], inK = key && have(key) > 0 ? '<span class="ink">Trong kho: ' + fmt(key, have(key)) + '</span>' : '';
  return '<button class="item' + (on ? ' on' : '') + '" data-k="' + k + '" aria-pressed="' + on + '"><span class="bx">' + TICK + '</span><span class="n">' + esc(name) + inK + '</span>' + (qty ? '<span class="q"><b>' + esc(qty) + '</b><span>~' + price + 'k</span></span>' : '') + '</button>';
}
function shopView() {
  const keys = shopKeys(), done = keys.filter(k => S.ck[k]).length, b = D.shop[0];
  const food = b.items.filter((_, i) => S.ck['s' + i]).length;
  let h = '<h1>Đi chợ</h1><div class="sub">Đã mua ' + done + '/' + keys.length + ' món</div>';
  h += '<div class="card"><div class="chead"><b>' + b.title + '</b><span class="price">~' + b.items.reduce((a, r) => a + r.price, 0) + 'k</span></div><div class="when">' + esc(b.when) + '</div>';
  h += b.items.map((r, i) => row('s' + i, r.name, r.qty, r.price, r.key)).join('') + '</div>';
  h += '<div class="card"><div class="chead"><b>Gia vị</b><span class="price">~20k</span></div><div class="when">Chỉ mua nếu ở nhà đã hết. Không tính vào kho.</div>' + D.spices.map((n, i) => row('g' + i, n)).join('') + '</div>';
  h += '<div class="total"><span>Tổng ước tính</span><b>~' + D.total + 'k</b></div>';
  h += '<button class="reset" data-reset="1">' + (armed === 'reset' ? 'Bấm lần nữa để bỏ tick hết' : 'Bỏ tick tất cả') + '</button>';
  h += '<div class="dock"><button class="cta wide" data-import="1"' + (food ? '' : ' disabled') + '>' + (food ? 'Cho ' + food + ' món đã tick vào kho' : 'Tick món đã mua để cho vào kho') + '</button></div>';
  return h;
}

let armed = '', armedAt = 0, openM = 0, toast = null, toastTimer = 0;
const arm = id => { if (armed === id && Date.now() - armedAt < 5000) { armed = ''; return true; } armed = id; armedAt = Date.now(); return false; };
function showToast(msg, undo) { toast = { msg, undo }; clearTimeout(toastTimer); toastTimer = setTimeout(() => { toast = null; render(); }, 6000); }

function render() {
  const t = S.tab === 'shop' || S.tab === 'kho' ? S.tab : 'menu';
  let h = '<main class="page' + (t === 'shop' ? ' hasdock' : '') + '">' + (t === 'shop' ? shopView() : t === 'kho' ? khoView() : menuView()) + '<div class="foot">Công thức từ Điện máy XANH / Bách hóa XANH.<br>Giá ước tính theo giá thường ở Bách hóa XANH, có thể lệch ±10–15%.</div></main>';
  if (toast) h += '<div class="toast" role="status"><span>' + esc(toast.msg) + '</span>' + (toast.undo ? '<button data-undo="1">Hoàn tác</button>' : '') + '</div>';
  const nb = (id, ic, label) => '<button class="' + (t === id ? 'act' : '') + '" data-tab="' + id + '"' + (t === id ? ' aria-current="page"' : '') + '>' + ic + label + '</button>';
  h += '<nav class="nav" aria-label="Điều hướng"><div>' + nb('menu', ICON_MENU, 'Thực đơn') + nb('kho', ICON_KHO, 'Kho') + nb('shop', ICON_SHOP, 'Đi chợ') + '</div></nav>';
  document.getElementById('app').innerHTML = h;
}
document.addEventListener('toggle', e => { const d = e.target; if (d.matches && d.matches('details.menu')) { if (d.open) openM = +d.dataset.m; else if (openM === +d.dataset.m) openM = 0; } }, true);
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  const d = b.dataset, snap = () => JSON.stringify({ kho: S.kho, ck: S.ck, cooked: S.cooked });
  if (!d.reset && !d.clear) armed = '';
  if (d.tab || d.only) {
    if (d.only) S.only = d.only === '1';
    if (d.tab) { S.tab = d.tab; try { window.scrollTo(0, 0); } catch (x) {} }
  } else if (d.k) { if (S.ck[d.k]) delete S.ck[d.k]; else S.ck[d.k] = true; }
  else if (d.import) {
    const before = snap(); let n = 0;
    D.shop[0].items.forEach((r, i) => { if (S.ck['s' + i]) { S.kho[r.key] = have(r.key) + r.amt; delete S.ck['s' + i]; n++; } });
    showToast('Đã cho ' + n + ' món vào kho', before);
  } else if (d.adj) {
    const u = D.ing[d.adj]; S.kho[d.adj] = Math.max(0, have(d.adj) + (+d.d) * u.step);
  } else if (d.cook) {
    const m = D.menus.find(x => x.id === +d.cook);
    if (!m || missing(m).length) return;
    const before = snap();
    Object.keys(m.need).forEach(k => { S.kho[k] = Math.max(0, have(k) - m.need[k]); });
    S.cooked[m.id] = (S.cooked[m.id] || 0) + 1; openM = 0;
    showToast('Đã trừ nguyên liệu thực đơn ' + m.id + ' khỏi kho', before);
  } else if (d.undo) {
    if (toast && toast.undo) Object.assign(S, JSON.parse(toast.undo));
    toast = null; clearTimeout(toastTimer);
  } else if (d.reset) { if (!arm('reset')) { render(); return; } S.ck = {}; }
  else if (d.clear) { if (!arm('clear')) { render(); return; } const before = snap(); S.kho = {}; showToast('Đã xoá kho', before); }
  else return;
  save(); render();
});
render();
}
</script>
</body>
</html>
