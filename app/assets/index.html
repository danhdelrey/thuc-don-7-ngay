<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2E6B45">
<title>Thực đơn 7 ngày</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;min-width:0}
html,body{margin:0;background:#F2F6F0;color:#1C2420;font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0;text-align:left}
button:focus-visible{outline:3px solid #8FC7A2;outline-offset:2px}
.page{max-width:520px;margin:0 auto;padding:20px 16px calc(96px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
.top h1{margin:0;font-size:26px;line-height:1.2;font-weight:800}
.top p{margin:4px 0 0;font-size:15px;color:#4A554F}
.card{background:#fff;border-radius:20px;padding:18px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 2px rgba(28,36,32,.05)}
.q{font-size:20px;font-weight:800;line-height:1.3}
.muted{font-size:14px;color:#5B6660;line-height:1.45}
.org{color:#8A3D10}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.t1{background:#E3EFE6;color:#2E6B45}.t2{background:#E3EEF7;color:#1F5C8A}.tdone{background:#E6ECE4;color:#4A554F}.ttoday{background:#2E6B45;color:#fff}.ttom{background:#FCEBDD;color:#8A3D10}
.pick{display:flex;flex-direction:column;gap:4px;width:100%;padding:14px 16px;border:1.5px solid #DCE5D9;border-radius:16px;background:#FAFCF9;min-height:64px}
.pick:active{background:#EEF4EC}
.pick .nm{font-size:18px;font-weight:700}
.pick .sm{font-size:14px;color:#5B6660;line-height:1.4}
.pick .rw{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec{font-size:13px;font-weight:700;color:#4A554F;margin-top:4px}
.prog{display:flex;align-items:center;gap:10px}.bar{flex:1;height:10px;background:#E6ECE4;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:#2E6B45;border-radius:999px;transition:width .25s}
.prog b{font-size:14px;white-space:nowrap}
.chk{display:flex;gap:14px;align-items:flex-start;width:100%;padding:14px;border-radius:16px;background:#FAFCF9;border:1.5px solid #E6ECE4;min-height:64px}
.chk .bx{flex:0 0 30px;width:30px;height:30px;border-radius:9px;border:2.5px solid #2E6B45;background:#fff;display:flex;align-items:center;justify-content:center;color:#fff;margin-top:1px}
.chk .bx svg{display:none}
.chk.on{background:#F1F6EF;border-color:#D5E4D2}.chk.on .bx{background:#2E6B45}.chk.on .bx svg{display:block}
.chk .tx{flex:1;display:flex;flex-direction:column;gap:3px}
.chk .nm{font-size:17px;font-weight:600;line-height:1.35}
.chk.on .nm{color:#8A958F;text-decoration:line-through}
.chk .sm{font-size:14px;color:#5B6660;line-height:1.4}
.pill{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;margin-right:6px}
.p-A{color:#2E6B45;background:#E3EFE6}.p-B{color:#8A3D10;background:#FCEBDD}.p-Canh{color:#1F5C8A;background:#E3EEF7}.p-Rau{color:#4D5B10;background:#EEF2DC}
.big{width:100%;min-height:54px;border-radius:16px;background:#2E6B45;color:#fff;font-size:17px;font-weight:700;text-align:center}
.big.sec2{background:#fff;color:#2E6B45;border:1.5px solid #2E6B45}
.link{color:#2E6B45;font-size:15px;font-weight:700;min-height:44px;padding:0 4px}
.done{background:#2E6B45;color:#fff}
.done .muted{color:#D7EBDD}
.meals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.meal{background:rgba(255,255,255,.14);border-radius:12px;padding:10px;font-size:14px;line-height:1.35}
.meal b{display:block;font-size:12px;letter-spacing:.5px;opacity:.85}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x mandatory}
.chips button{flex:0 0 auto;scroll-snap-align:start;min-height:48px;padding:8px 14px;border-radius:14px;border:1.5px solid #DCE5D9;background:#fff;font-size:15px;font-weight:600;max-width:220px}
.guide ol{margin:0;padding-left:22px;font-size:15px;line-height:1.6}
.list{display:flex;flex-direction:column;gap:10px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:#E1E9DE;border-radius:14px;padding:4px}
.seg button{min-height:46px;border-radius:11px;font-size:15px;font-weight:700;color:#4A554F;text-align:center;line-height:1.2}
.seg button.on{background:#fff;color:#2E6B45;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.shop .chk{align-items:center;min-height:58px}
.qty{text-align:right;white-space:nowrap}.qty b{display:block;font-size:16px}.qty span{font-size:13px;color:#8A3D10}
.totalbar{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.totalbar b{font-size:22px;color:#8A3D10}
details{background:#fff;border-radius:16px;padding:4px 16px}
summary{min-height:48px;display:flex;align-items:center;font-weight:700;cursor:pointer}
details ul{margin:0 0 12px;padding-left:20px;font-size:15px;line-height:1.6}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #E1E9DE;padding-bottom:env(safe-area-inset-bottom);z-index:5}
.nav div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:64px;font-size:13px;font-weight:700;color:#6B766F;text-align:center;position:relative}
.nav button.on{color:#2E6B45}
.nav button.on svg{stroke:#2E6B45}
.nav .dot{position:absolute;top:8px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#8A3D10;color:#fff;font-size:11px;line-height:18px}
.shade{position:fixed;inset:0;background:rgba(20,28,24,.45);z-index:8;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:88vh;overflow-y:auto;background:#F2F6F0;border-radius:24px 24px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;animation:up .2s ease-out}
.grab{width:44px;height:5px;border-radius:9px;background:#C9D5C5;margin:0 auto 4px}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.bar i{transition:none}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));background:#1C2420;color:#fff;border-radius:14px;padding:10px 12px 10px 16px;display:flex;gap:12px;align-items:center;font-size:15px;z-index:9;max-width:92vw}
.toast button{color:#9FD6B0;font-weight:700;min-height:40px;padding:0 6px}
.foot{font-size:12px;color:#5B6660;text-align:center;line-height:1.5}
</style>
</head>

<script>
{

pe": "B", "when": "Tối", "name": "Nấm kim châm xào trứng", "ingr": "1 gói nấm kim châm · 2 quả trứng · nước tương", "price": 21}, {"type": "Canh", "when": "Sáng + tối", "name": "Canh bắp cải thịt bằm", "ingr": "~250 g bắp cải · 60 g thịt bằm (S)", "price": 14}, {"type": "Rau", "when": "Trưa + tối", "name": "Bí đỏ xào tỏi", "ingr": "~300 g bí đỏ · tỏi", "price": 8}], "bagList": ["G2", "S"]}], "batches": [{"id": "s1", "title": "Đợt 1", "when": "Mua trước khi bắt đầu: toàn bộ thịt + rau cho thực đơn 1–3", "items": [{"name": "Thịt heo bằm", "qty": "1 kg", "price": 143}, {"name": "Thịt heo thái lát", "qty": "300 g", "price": 40}, {"name": "Đùi gà phi lê", "qty": "900 g", "price": 81}, {"name": "Trứng gà", "qty": "10 quả", "price": 28}, {"name": "Đậu hũ trắng", "qty": "2 miếng", "price": 12}, {"name": "Cà chua", "qty": "6 quả", "price": 27}, {"name": "Hành tây", "qty": "1 củ", "price": 6}, {"name": "Cải ngọt", "qty": "1 bó ~500 g", "price": 13}, {"name": "Cải thìa", "qty": "1 bó ~350 g", "price": 11}, {"name": "Mướp", "qty": "2 quả", "price": 15}, {"name": "Bí đỏ", "qty": "~350 g", "price": 9}, {"name": "Hành lá", "qty": "1 bó nhỏ", "price": 5}], "total": 390}, {"id": "s2", "title": "Đợt 2", "when": "Mua khi gần ăn hết thực đơn 1–3: rau củ cho thực đơn 4–7", "items": [{"name": "Cá basa phi lê", "qty": "150 g", "price": 11}, {"name": "Đậu hũ trắng", "qty": "2 miếng", "price": 12}, {"name": "Đậu hũ non", "qty": "1 hộp", "price": 12}, {"name": "Kim chi", "qty": "~200–250 g", "price": 28}, {"name": "Cà chua", "qty": "4 quả", "price": 18}, {"name": "Bắp cải", "qty": "1 cái ~900 g", "price": 18}, {"name": "Bí đao", "qty": "~400 g", "price": 8}, {"name": "Đậu que", "qty": "~300 g", "price": 9}, {"name": "Nấm kim châm", "qty": "2 gói", "price": 30}, {"name": "Bông cải xanh", "qty": "1 bông ~300 g", "price": 15}, {"name": "Bí đỏ", "qty": "~300 g", "price": 8}, {"name": "Hành lá", "qty": "1 bó nhỏ", "price": 5}], "total": 174}], "spices": ["Nước mắm", "Nước tương", "Muối", "Đường", "Hạt nêm", "Tiêu", "Dầu ăn", "Dầu hào", "Ớt", "Tỏi 2–3 củ", "Hành tím 4–5 củ", "Sả 3 cây", "Gừng 1 củ nhỏ"], "total": 583, "groups": {"1": {"title": "Nhóm 1 · ăn trước", "desc": "Dùng đồ đợt 1. Có rau lá mau héo nên ăn hết trong khoảng 3 ngày sau khi đi chợ, thứ tự tùy bạn."}, "2": {"title": "Nhóm 2 · ăn sau", "desc": "Dùng đồ đợt 2, mua khi gần ăn hết nhóm 1. Rau củ để được lâu, thứ tự tùy bạn; riêng đậu hũ trắng nên nấu trong 3 ngày."}}, "bags": {"S": "60 g thịt bằm", "L": "210 g thịt bằm", "M": "70 g thịt bằm", "T2": "200 g thịt lát", "T1": "100 g thịt lát", "G1": "300 g đùi gà ướp sả ớt", "G2": "300 g đùi gà ướp gừng", "G3": "300 g đùi gà ướp tỏi", "C": "150 g cá basa"}};
const KEY = 'thucdon7-v3';
const TICK = '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const ICON = {
  today: '<svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6B766F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M8 20h8"/><path d="M9 7c0-1.5 1-2 1-3.5M13 7c0-1.5 1-2 1-3.5"/></svg>',
  menu: '<svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6B766F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>',
  shop: '<svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6B766F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg>'
};
const fresh = () => ({ tab: 'today', seg: 0, today: 0, tomorrow: 0, cooked: false, date: '', eaten: {}, ck: {}, guide: true });
let S = fresh();
let sheet = 0, toast = null, toastTimer = 0, undo = null;
try { const v = JSON.parse(localStorage.getItem(KEY) || 'null'); if (v) S = Object.assign(fresh(), v); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const dayStr = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
const C = id => D.combos[id - 1];
const on = k => !!S.ck[k];
const eatenN = () => D.combos.filter(c => S.eaten[c.id]).length;
const left = () => D.combos.filter(c => !S.eaten[c.id]);
const shopKeys = b => D.batches[b].items.map((_, i) => 's' + b + '-' + i);
const shopDone = b => shopKeys(b).filter(on).length;
const bar = (a, b) => '<div class="prog"><div class="bar"><i style="width:' + (b ? Math.round(100 * a / b) : 0) + '%"></i></div><b>';
const gtag = c => '<span class="tag ' + (c.group === 1 ? 't1' : 't2') + '">' + (c.group === 1 ? 'Đồ đợt 1' : 'Đồ đợt 2') + '</span>';

// New calendar day: yesterday's cooked menu is done, tomorrow's becomes today.
(function rollDay() {
  const t = dayStr();
  if (S.date && S.date !== t && S.today && S.cooked) {
    S.eaten[S.today] = true; S.today = S.tomorrow && !S.eaten[S.tomorrow] ? S.tomorrow : 0; S.tomorrow = 0; S.cooked = false; S.date = S.today ? t : '';
    save();
  }
})();

function setToday(id) { S.today = id; S.cooked = false; S.date = dayStr(); if (S.tomorrow === id) S.tomorrow = 0; }
function pickRow(c, act) {
  return '<button class="pick" data-act="' + act + '" data-id="' + c.id + '"><span class="rw"><span class="nm">' + c.id + '. ' + esc(c.name) + '</span>' + gtag(c) + '</span><span class="sm">' + esc(c.items.slice(1).map(i => i.name).join(' · ')) + '</span></button>';
}
function chooser(act, exclude) {
  const rest = left().filter(c => c.id !== exclude);
  const g1 = rest.filter(c => c.group === 1), g2 = rest.filter(c => c.group === 2);
  let h = '';
  if (g1.length) h += '<div class="sec">Nên nấu trước · rau mau héo</div><div class="list">' + g1.map(c => pickRow(c, act)).join('') + '</div>';
  if (g2.length) h += '<div class="sec">' + (g1.length ? 'Sau khi mua đồ đợt 2' : 'Còn lại') + '</div><div class="list">' + g2.map(c => pickRow(c, act)).join('') + '</div>';
  return h;
}
function dishRows(c) {
  return c.items.map((it, i) => {
    const k = 'c' + c.id + '-' + i;
    return '<button class="chk' + (on(k) ? ' on' : '') + '" data-ck="' + k + '" aria-pressed="' + on(k) + '"><span class="bx">' + TICK + '</span><span class="tx"><span class="sm"><span class="pill p-' + it.type + '">' + it.type + '</span>' + it.when + '</span><span class="nm">' + esc(it.name) + '</span><span class="sm">' + esc(it.ingr) + '</span></span></button>';
  }).join('');
}

function todayView() {
  let h = '<div class="top"><h1>Hôm nay</h1><p>Đã ăn ' + eatenN() + '/7 thực đơn</p></div>';
  if (S.guide && !S.today && eatenN() === 0) {
    h += '<div class="card guide"><div class="q">Cách dùng</div><ol><li>Đi chợ đợt 1 (tab Đi chợ).</li><li>Mỗi sáng chọn 1 thực đơn, nấu và tick từng món.</li><li>Buổi tối chọn món cho ngày mai, app nhắc túi nào cần rã đông.</li></ol><button class="link" data-act="hideguide">Đã hiểu</button></div>';
  }
  if (!left().length) {
    return h + '<div class="card"><div class="q">Xong cả 7 thực đơn</div><div class="muted">Đi chợ cho tuần mới rồi bắt đầu lại.</div><button class="big" data-act="reset">Bắt đầu tuần mới</button></div>';
  }
  if (!S.today) {
    h += '<div class="card"><div class="q">Sáng nay nấu thực đơn nào?</div>' + chooser('today', 0) + '</div>';
  } else {
    const c = C(S.today), n = c.items.filter((_, i) => on('c' + c.id + '-' + i)).length;
    if (!S.cooked) {
      h += '<div class="card"><div class="totalbar"><div class="q">' + c.id + '. ' + esc(c.name) + '</div><button class="link" data-act="change">Đổi</button></div>' + bar(n, 4) + n + '/4 món</b></div>' + dishRows(c);
      h += '<button class="big" data-act="cooked">Nấu xong cả 4 món</button></div>';
    } else {
      h += '<div class="card done"><div class="q">Đã nấu xong: ' + esc(c.name) + '</div><div class="meals"><div class="meal"><b>SÁNG</b>Món A + canh</div><div class="meal"><b>TRƯA</b>Món A + rau (hộp)</div><div class="meal"><b>TỐI</b>Món B + canh + rau</div></div><div class="muted">Cất phần trưa và tối vào ngăn mát sau khi nguội.</div></div>';
    }
  }
  // Tonight: pick tomorrow & thaw
  const restForTom = left().filter(c => c.id !== S.today);
  if (restForTom.length) {
    h += '<div class="card"><div class="q">Tối nay: mai ăn gì?</div>';
    if (!S.tomorrow) {
      h += '<div class="muted">Chọn trước để biết cần rã đông túi nào.</div><div class="chips">' + restForTom.map(c => '<button data-act="tomorrow" data-id="' + c.id + '">' + c.id + '. ' + esc(c.name) + '</button>').join('') + '</div>';
    } else {
      const m = C(S.tomorrow);
      h += '<div class="totalbar"><div style="font-size:18px;font-weight:700">' + m.id + '. ' + esc(m.name) + '</div><button class="link" data-act="untomorrow">Đổi</button></div>';
      h += '<div class="sec">Chuyển các túi này từ ngăn đá xuống ngăn mát</div>';
      h += m.bagList.map(b => { const k = 'thaw' + m.id + '-' + b; return '<button class="chk' + (on(k) ? ' on' : '') + '" data-ck="' + k + '" aria-pressed="' + on(k) + '"><span class="bx">' + TICK + '</span><span class="tx"><span class="nm">Túi ' + b + '</span><span class="sm">' + esc(D.bags[b]) + '</span></span></button>'; }).join('');
    }
    h += '</div>';
  }
  return h;
}

function menuView() {
  let h = '<div class="top"><h1>7 thực đơn</h1><p>Ăn theo thứ tự tùy thích · cả tuần <b class="org">~' + D.total + 'k</b></p></div>';
  [1, 2].forEach(g => {
    h += '<div class="sec">' + (g === 1 ? 'Dùng đồ đợt 1 · nấu trước, trong ~3 ngày' : 'Dùng đồ đợt 2 · nấu sau') + '</div><div class="list">';
    D.combos.filter(c => c.group === g).forEach(c => {
      const st = S.today === c.id ? '<span class="tag ttoday">Hôm nay</span>' : S.tomorrow === c.id ? '<span class="tag ttom">Ngày mai</span>' : S.eaten[c.id] ? '<span class="tag tdone">Đã ăn</span>' : '<span class="price org" style="font-size:14px;font-weight:700">~' + c.total + 'k</span>';
      h += '<button class="pick" data-act="open" data-id="' + c.id + '"' + (S.eaten[c.id] ? ' style="opacity:.6"' : '') + '><span class="rw"><span class="nm">' + c.id + '. ' + esc(c.name) + '</span>' + st + '</span><span class="sm">' + esc(c.items.slice(1).map(i => i.name).join(' · ')) + '</span></button>';
    });
    h += '</div>';
  });
  h += '<details><summary>Mã túi chia sẵn</summary><ul>' + Object.keys(D.bags).map(b => '<li><b>' + b + '</b> · ' + esc(D.bags[b]) + '</li>').join('') + '</ul></details>';
  h += '<button class="big sec2" data-act="reset">Bắt đầu tuần mới</button>';
  return h;
}

function shopView() {
  const segs = [['Đợt 1', shopDone(0) + '/' + D.batches[0].items.length], ['Đợt 2', shopDone(1) + '/' + D.batches[1].items.length], ['Gia vị', '']];
  let h = '<div class="top"><h1>Đi chợ</h1><p>Cả tuần khoảng <b class="org">~' + D.total + 'k</b> · săn sale ~455k</p></div>';
  h += '<div class="seg" role="tablist">' + segs.map((s, i) => '<button role="tab" class="' + (S.seg === i ? 'on' : '') + '" data-seg="' + i + '">' + s[0] + (s[1] ? '<br><small style="font-weight:600">' + s[1] + '</small>' : '') + '</button>').join('') + '</div>';
  if (S.seg < 2) {
    const b = D.batches[S.seg], keys = shopKeys(S.seg), n = shopDone(S.seg);
    h += '<div class="card"><div class="totalbar"><div class="q">' + b.title + '</div><b>~' + b.total + 'k</b></div><div class="muted">' + esc(b.when) + '</div>' + bar(n, keys.length) + n + '/' + keys.length + ' đã mua</b></div>';
    const rows = b.items.map((r, i) => ({ r, k: keys[i] }));
    const order = rows.filter(x => !on(x.k)).concat(rows.filter(x => on(x.k)));
    h += '<div class="list shop">' + order.map(x => '<button class="chk' + (on(x.k) ? ' on' : '') + '" data-ck="' + x.k + '" aria-pressed="' + on(x.k) + '"><span class="bx">' + TICK + '</span><span class="tx"><span class="nm">' + esc(x.r.name) + '</span></span><span class="qty"><b>' + esc(x.r.qty) + '</b><span>~' + x.r.price + 'k</span></span></button>').join('') + '</div></div>';
  } else {
    h += '<div class="card"><div class="q">Gia vị</div><div class="muted">Chỉ mua nếu ở nhà đã hết. Tỏi, hành tím, sả, gừng khoảng ~20k.</div><div class="list shop">' + D.spices.map((n, i) => { const k = 'sp-' + i; return '<button class="chk' + (on(k) ? ' on' : '') + '" data-ck="' + k + '" aria-pressed="' + on(k) + '"><span class="bx">' + TICK + '</span><span class="tx"><span class="nm">' + esc(n) + '</span></span></button>'; }).join('') + '</div></div>';
  }
  h += '<details><summary>Đi chợ về làm gì?</summary><ul><li>Chia thịt, gà, cá thành túi theo mã (xem tab Thực đơn).</li><li>Túi của thực đơn nấu sáng mai để ngăn mát, còn lại cấp đông.</li><li>Rau chưa rửa, bọc giấy cho vào ngăn rau; đậu hũ ngâm nước, thay nước mỗi ngày.</li></ul></details>';
  return h;
}

function sheetView() {
  if (!sheet) return '';
  const c = C(sheet);
  let h = '<div class="shade" data-act="close"><div class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(c.name) + '"><div class="grab"></div>';
  h += '<div class="totalbar"><div class="q">' + c.id + '. ' + esc(c.name) + '</div><b class="org" style="font-size:16px">~' + c.total + 'k</b></div>';
  h += '<div class="muted">' + gtag(c) + ' &nbsp;Rã đông tối hôm trước: <b>' + c.bagList.map(b => b + ' (' + esc(D.bags[b]) + ')').join(', ') + '</b></div>';
  h += c.items.map(it => '<div class="chk" style="cursor:default"><span class="tx"><span class="sm"><span class="pill p-' + it.type + '">' + it.type + '</span>' + it.when + ' · <span class="org">~' + it.price + 'k</span></span><span class="nm">' + esc(it.name) + '</span><span class="sm">' + esc(it.ingr) + '</span></span></div>').join('');
  if (S.eaten[c.id]) h += '<button class="big sec2" data-act="uneat" data-id="' + c.id + '">Đánh dấu là chưa ăn</button>';
  else {
    if (S.today !== c.id) h += '<button class="big" data-act="today" data-id="' + c.id + '">Nấu hôm nay</button>';
    if (S.tomorrow !== c.id && S.today !== c.id) h += '<button class="big sec2" data-act="tomorrow" data-id="' + c.id + '">Để mai ăn</button>';
  }
  h += '<button class="link" style="align-self:center" data-act="close">Đóng</button></div></div>';
  return h;
}

function render() {
  const views = { today: todayView, menu: menuView, shop: shopView };
  const leftShop = D.batches.reduce((a, b, i) => a + b.items.length - shopDone(i), 0);
  let h = '<main class="page">' + views[S.tab]() + '<div class="foot">Giá ước tính theo giá thường ở Bách hóa XANH, có thể lệch ±10–15%.</div></main>';
  h += '<nav class="nav" aria-label="Điều hướng"><div>' + [['today', 'Hôm nay'], ['menu', 'Thực đơn'], ['shop', 'Đi chợ']].map(t => '<button class="' + (S.tab === t[0] ? 'on' : '') + '" data-tab="' + t[0] + '" aria-current="' + (S.tab === t[0] ? 'page' : 'false') + '">' + ICON[t[0]] + t[1] + (t[0] === 'menu' ? '<span class="dot">' + left().length + '</span>' : '') + '</button>').join('') + '</div></nav>';
  h += sheetView();
  if (toast) h += '<div class="toast" role="status">' + esc(toast) + (undo ? '<button data-act="undo">Hoàn tác</button>' : '') + '</div>';
  document.getElementById('app').innerHTML = h;
}
function showToast(msg, u) { toast = msg; undo = u || null; clearTimeout(toastTimer); toastTimer = setTimeout(() => { toast = null; undo = null; render(); }, 5000); }
function openSheet(id) { sheet = id; if (location.hash !== '#chi-tiet') location.hash = 'chi-tiet'; }
function closeSheet() { sheet = 0; if (location.hash === '#chi-tiet') history.back(); }
window.addEventListener('hashchange', () => { if (location.hash !== '#chi-tiet' && sheet) { sheet = 0; render(); } });

let resetArmed = 0;
document.addEventListener('click', e => {
  const b = e.target.closest('button,[data-act="close"]'); if (!b) return;
  if (b.classList.contains('shade') && e.target !== b) return;
  const a = b.dataset.act, id = +b.dataset.id;
  const snap = JSON.stringify(S);
  if (b.dataset.tab) { S.tab = b.dataset.tab; sheet = 0; window.scrollTo(0, 0); }
  else if (b.dataset.seg) { S.seg = +b.dataset.seg; }
  else if (b.dataset.ck) { const k = b.dataset.ck; if (S.ck[k]) delete S.ck[k]; else S.ck[k] = true; }
  else if (a === 'today') { setToday(id); sheet = 0; S.tab = 'today'; if (location.hash === '#chi-tiet') history.back(); window.scrollTo(0, 0); }
  else if (a === 'tomorrow') { S.tomorrow = id; if (sheet) closeSheet(); showToast('Mai ăn: ' + C(id).name); }
  else if (a === 'untomorrow') { S.tomorrow = 0; }
  else if (a === 'change') { S.today = 0; S.cooked = false; }
  else if (a === 'cooked') { S.cooked = true; S.date = dayStr(); showToast('Đã nấu xong. Tối nhớ chọn món cho mai.', snap); }
  else if (a === 'uneat') { delete S.eaten[id]; closeSheet(); }
  else if (a === 'open') { openSheet(id); }
  else if (a === 'close') { closeSheet(); }
  else if (a === 'hideguide') { S.guide = false; }
  else if (a === 'undo') { if (undo) { S = JSON.parse(undo); undo = null; toast = null; } }
  else if (a === 'reset') {
    const now = Date.now();
    if (now - resetArmed > 4000) { resetArmed = now; showToast('Bấm “Bắt đầu tuần mới” lần nữa để xóa hết tick.'); render(); return; }
    resetArmed = 0; S = fresh(); toast = null; window.scrollTo(0, 0);
  }
  else return;
  save(); render();
});
render();
}
</script>
</body>
